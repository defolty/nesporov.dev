name: Repository security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"

      - name: Scan repository and history
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--all --full-history" \
            --config="$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path="$RUNNER_TEMP/no-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir . \
            --config="$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path="$RUNNER_TEMP/no-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner
